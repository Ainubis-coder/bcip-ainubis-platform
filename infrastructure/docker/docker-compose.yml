version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bcip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcip_user
      POSTGRES_PASSWORD: bcip_secure_password
      POSTGRES_DB: bcip_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../schemas/database-schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcip_user -d bcip_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bcip_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secure_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secure_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
